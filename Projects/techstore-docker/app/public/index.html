<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore — Docker Edition</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #fff;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
      }
      .hero {
        text-align: center;
        padding: 4rem 0;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: #888;
        font-size: 1.2rem;
        margin-bottom: 2rem;
      }
      .badge {
        display: inline-block;
        background: #00ff88;
        color: #000;
        padding: 0.3rem 1rem;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin: 2rem 0;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 1.5rem;
      }
      .card h3 {
        margin-bottom: 0.5rem;
      }
      .card p {
        color: #888;
        font-size: 0.9rem;
      }
      .status {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 2rem;
        margin: 2rem 0;
      }
      .status h2 {
        margin-bottom: 1rem;
      }
      .status-item {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid #222;
      }
      .ok {
        color: #00ff88;
      }
      .error {
        color: #ff4444;
      }
      .products {
        margin: 2rem 0;
      }
      .product {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1rem 1.5rem;
        margin: 0.5rem 0;
      }
      .price {
        color: #00ff88;
        font-weight: bold;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <h1>TechStore</h1>
        <p class="subtitle">Full-Stack E-Commerce — Docker Edition</p>
        <span class="badge">Dockerized</span>
      </div>

      <div class="status" id="status">
        <h2>System Status</h2>
        <div class="status-item">
          <span>Application</span>
          <span id="app-status" class="ok">Checking...</span>
        </div>
        <div class="status-item">
          <span>Database</span>
          <span id="db-status">Checking...</span>
        </div>
        <div class="status-item">
          <span>Cache</span>
          <span id="redis-status">Checking...</span>
        </div>
      </div>

      <div class="products">
        <h2>Products</h2>
        <div id="products-list">Loading...</div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>One Command Deploy</h3>
          <p>docker compose up -d</p>
        </div>
        <div class="card">
          <h3>One Command Backup</h3>
          <p>./scripts/backup.sh</p>
        </div>
        <div class="card">
          <h3>One Command Monitor</h3>
          <p>./scripts/monitor.sh</p>
        </div>
      </div>
    </div>

    <script>
      fetch("/health")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("app-status").textContent = "Online";
          document.getElementById("app-status").className = "ok";
          document.getElementById("db-status").textContent =
            data.checks?.postgres || "Unknown";
          document.getElementById("db-status").className =
            data.checks?.postgres === "ok" ? "ok" : "error";
          document.getElementById("redis-status").textContent =
            data.checks?.redis || "Unknown";
          document.getElementById("redis-status").className =
            data.checks?.redis === "ok" ? "ok" : "error";
        })
        .catch(() => {
          document.getElementById("app-status").textContent = "Offline";
          document.getElementById("app-status").className = "error";
        });

      fetch("/api/products")
        .then((r) => r.json())
        .then((products) => {
          const list = document.getElementById("products-list");
          list.innerHTML = products
            .map(
              (p) => `
                    <div class="product">
                        <div>
                            <strong>${p.name}</strong><br>
                            <small style="color:#888">${p.description}</small>
                        </div>
                        <span class="price">$${p.price}</span>
                    </div>
                `,
            )
            .join("");
        });
    </script>
  </body>
</html>
